# Configuración de despliegue en Netlify.
# En Netlify: Base directory = Frontend (el resto lo toma de este archivo).

[build]
  command = "npm run build"
  publish = "dist/Frontend/browser"

[build.environment]
  NODE_VERSION = "24"

# Proxy hacia el backend de la VM a través del túnel de ngrok.
# El navegador llama a https://TU-SITIO.netlify.app/api/... y Netlify reenvía
# la petición al dominio fijo de ngrok, que llega al back dentro de la VM.
# Dominio fijo de ngrok (Dashboard de ngrok → Domains).
# La cabecera evita la página de aviso que ngrok muestra en el plan gratuito.
[[redirects]]
  from = "/api/*"
  to = "https://bolster-upstairs-antidote.ngrok-free.dev/:splat"
  status = 200
  force = true
  headers = { ngrok-skip-browser-warning = "true" }

# Rutas de Angular: cualquier otra URL carga index.html (evita 404 al recargar).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
